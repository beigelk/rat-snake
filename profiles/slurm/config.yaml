# Submit jobs to SLURM. Needs snakemake-executor-plugin-slurm (installed by
# envs/conda_setup.sh). Edit account and partition for your cluster.
#
# Values are the ones from the dev branch's profile (they work on this
# cluster); rules added in the restructure are at the end.
# With Slurm, cpus_per_task (not threads) sets the CPUs a job gets.
executor: slurm
jobs: 100
latency-wait: 60
rerun-incomplete: true
printshellcmds: true

resources:
  cellranger_jobs: 24
  soupx_jobs: 24
  doubletfinder_jobs: 24
  dsb_jobs: 24
  construct_jobs: 24
  merge_jobs: 1

default-resources:
  slurm_account: "hpcusers"
  slurm_partition: "defq"
  mem_mb: 8000
  runtime: 60
  ntasks: 1
  cpus_per_task: 1

set-threads:
  cellranger_multi: 16
  construct: 16
  merge: 34
  cluster: 32

set-resources:
  cellranger_multi:
    mem_mb: 64000
    runtime: 24:00:00
    time: 24:00:00
    cpus_per_task: 16
    cellranger_jobs: 1

  soupx:
    mem_mb: 64000
    runtime: 4:00:00
    time: 4:00:00
    cpus_per_task: 4
    soupx_jobs: 1

  doubletfinder:
    mem_mb: 64000
    runtime: 4:00:00
    time: 4:00:00
    cpus_per_task: 4
    doubletfinder_jobs: 1

  dsb:
    mem_mb: 30000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 2
    dsb_jobs: 1

  construct:
    mem_mb: 64000
    runtime: 4:00:00
    time: 4:00:00
    cpus_per_task: 16
    construct_jobs: 1

  merge:
    mem_mb: 480000
    runtime: 8:00:00
    time: 8:00:00
    cpus_per_task: 16
    merge_jobs: 1

  harmony:
    mem_mb: 480000
    runtime: 8:00:00
    time: 8:00:00
    cpus_per_task: 16

  metadata:
    mem_mb: 200000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 2

  cluster:
    mem_mb: 200000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 4

  subset:
    mem_mb: 100000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 4

  compile:
    mem_mb: 200000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 4

  findallmarkers:
    mem_mb: "attempt * 100000"
    runtime: "attempt * 120"
    time: "attempt * 60"
    cpus_per_task: 2
    retries: 3


  # -- Rules added in the restructure (same time format as above) ------------
  tcr_clones:
    mem_mb: 16000
    runtime: 1:00:00
    time: 1:00:00
    cpus_per_task: 1
  clustree:
    mem_mb: 100000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 1
  metadata_plots:
    mem_mb: 200000
    runtime: 4:00:00
    time: 4:00:00
    cpus_per_task: 2
  dotplot:
    mem_mb: 100000
    runtime: 1:00:00
    time: 1:00:00
    cpus_per_task: 1
  markerplots:
    mem_mb: 100000
    runtime: 2:00:00
    time: 2:00:00
    cpus_per_task: 1
  build_report:
    mem_mb: 8000
    runtime: 1:00:00
    time: 1:00:00
    cpus_per_task: 1
