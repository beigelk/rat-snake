# Build one image per module environment (env.yaml -> rat-<module>,
# env_r.yaml -> rat-<module>-r, env_doublet.yaml -> rat-<module>-doublet) and
# push it to GHCR. Runs on GitHub's machines, so your servers never need
# Docker. Pull on the cluster with:
#   singularity pull docker://ghcr.io/<owner>/rat-<module>-r:latest
#
# Only env files that changed (or whose <env>.post.R changed) are rebuilt;
# run it by hand (Actions > Build module images > Run workflow) to rebuild
# everything.
name: Build module images

on:
  push:
    branches: [main]
    paths: ["workflow/modules/*/env*", "core"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        run: |
          # One entry per env file: {"module": "preprocess", "file": "env_r.yaml", "image": "preprocess-r"}
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            files=$(ls workflow/modules/*/env*.yaml)
          else
            # A changed post-install script rebuilds its env
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'workflow/modules/*/env*' \
                    | sed -E 's/\.post\.R$/.yaml/' | sort -u)
          fi
          list=$(for f in $files; do
            [[ -f "$f" ]] || continue
            m=$(echo "$f" | cut -d/ -f3); b=$(basename "$f" .yaml); v=${b#env}
            jq -nc --arg m "$m" --arg f "$b.yaml" --arg i "$m${v/_/-}" '{module: $m, file: $f, image: $i}'
          done | jq -cs .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: modules
    if: needs.modules.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workflow/modules/${{ matrix.env.module }}
          file: core/docker/conda.Dockerfile
          build-args: ENV_FILE=${{ matrix.env.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rat-${{ matrix.env.image }}:latest
            ghcr.io/${{ github.repository_owner }}/rat-${{ matrix.env.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.env.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.env.image }}
